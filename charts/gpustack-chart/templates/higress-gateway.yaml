{{- with (index .Subcharts "higress-core") }}
{{- if .Files.Get "gpustack-observability" }}
{{- $gateway := . }}
{{- $configGateway := $gateway }}
{{- $collectLogs := include "gpustack.collectHigressLogs" $ }}
{{- $trace := and $gateway.Values.global.enableIstioAPI (include "gpustack.tracingEndpoint" $) }}
{{- if and $.Values.server.enabled (or $trace $collectLogs) }}
{{- $defaults := include "mesh" $configGateway | fromYaml }}
{{- $mesh := $configGateway.Values.meshConfig | default dict }}
{{- $format := $mesh.accessLogFormat | default $defaults.accessLogFormat }}
{{- $encoding := $mesh.accessLogEncoding | default $defaults.accessLogEncoding }}
{{- if and (eq ($format | trim) ($defaults.accessLogFormat | trim)) (eq $encoding $defaults.accessLogEncoding) }}
{{- if $trace }}
{{- $format = replace `"trace_id":"%REQ(X-B3-TRACEID)%"` `"traceparent":"%REQ(TRACEPARENT):55%"` $format }}
{{- end }}
{{- $mesh = mergeOverwrite (deepCopy $mesh) (dict "accessLogEncoding" "JSON" "accessLogFormat" $format) }}
{{- $values := set (omit $configGateway.Values "meshConfig") "meshConfig" $mesh }}
{{- $configGateway = set (omit $configGateway "Values") "Values" $values }}
{{- end }}
{{- end }}
{{- include "gpustack.higress.ConfigMap" $configGateway }}
{{- $kind := $gateway.Values.gateway.kind }}
{{- if has $kind (list "Deployment" "DaemonSet") }}
{{- printf "\n---\n" }}
{{- $manifest := include (printf "gpustack.higress.%s" $kind) $gateway }}
{{- if $collectLogs }}
{{- $workload := $manifest | fromYaml }}
{{- $labels := $workload.spec.template.metadata.labels }}
{{- $_ := set $labels "gpustack.ai/log-release" $.Release.Name }}
{{- $_ := set $labels "gpustack.ai/log-source" "higress" }}
{{- toYaml $workload }}
{{- else }}
{{- $manifest }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
