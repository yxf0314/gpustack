{{- define "gpustack.higressCollectorConfig" -}}
{{- $gatewayName := include "gateway.name" (index .Subcharts "higress-core") -}}
extensions:
  file_storage:
    directory: /var/lib/otelcol
receivers:
  filelog/higress:
    include:
      - {{ printf "/var/log/pods/%s_%s-*_*/higress-gateway/[0-9]*.log" .Release.Namespace $gatewayName | quote }}
    include_file_path: true
    start_at: end
    storage: file_storage
    operators:
      - type: container
      - type: json_parser
        on_error: drop
      - type: filter
        expr: 'attributes.method == nil or attributes.path == nil or attributes.response_code == nil'
processors:
  # Keep the access-log transform aligned with the in-image Collector.
  transform/higress:
    error_mode: ignore
    log_statements:
      # Envoy writes the active traceparent when the router dispatches upstream.
      - merge_maps(log.cache, ExtractPatterns(log.attributes["traceparent"], "^00-(?P<trace_id>[0-9a-f]{32})-(?P<propagated_span_id>[0-9a-f]{16})-01$"), "upsert") where IsString(log.attributes["traceparent"]) and IsString(log.attributes["upstream_host"]) and log.attributes["upstream_host"] != "-"
      - set(log.trace_id, TraceID(log.cache["trace_id"])) where IsString(log.cache["trace_id"]) and log.cache["trace_id"] != "00000000000000000000000000000000" and log.cache["propagated_span_id"] != "0000000000000000"
      - set(log.body, "Higress access log")
      # Only the successful response's native PD coordinator ID is exported from AI statistics.
      - delete_key(log.attributes, "pd_coordinator_id")
      - set(log.cache["ai_log"], ParseJSON(log.attributes["ai_log"])) where (log.attributes["response_code"] == 200 or log.attributes["response_code"] == "200") and IsString(log.attributes["ai_log"]) and IsMatch(log.attributes["ai_log"], "___prefill_addr_")
      - set(log.cache["ai_log"], log.attributes["ai_log"]) where (log.attributes["response_code"] == 200 or log.attributes["response_code"] == "200") and IsMap(log.attributes["ai_log"])
      - merge_maps(log.attributes, ExtractPatterns(log.cache["ai_log"]["chat_id"], "^(?:chatcmpl-|cmpl-)(?P<pd_coordinator_id>___prefill_addr_[A-Za-z0-9_.:\\[\\]-]{1,256}___decode_addr_[A-Za-z0-9_.:\\[\\]-]{1,256}_[0-9a-fA-F]{32})$"), "upsert") where IsString(log.cache["ai_log"]["chat_id"])
      - keep_keys(log.attributes, ["request_id", "pd_coordinator_id", "method", "path", "response_code", "duration", "response_flags", "upstream_cluster", "upstream_host"])
      - set(log.attributes["path"], Split(log.attributes["path"], "?")[0]) where IsString(log.attributes["path"])
      - set(log.body, Concat([log.attributes["method"], log.attributes["path"], String(log.attributes["response_code"])], " ")) where IsString(log.attributes["method"]) and IsString(log.attributes["path"]) and (IsString(log.attributes["response_code"]) or IsInt(log.attributes["response_code"]))
exporters:
  otlp_http/logs:
    logs_endpoint: ${env:GPUSTACK_LOG_OTLP_ENDPOINT}
    {{- if .Values.logging.authorizationSecret.name }}
    headers:
      Authorization: ${env:GPUSTACK_LOG_OTLP_AUTHORIZATION}
    {{- end }}
    {{- if .Values.logging.caSecret.name }}
    tls:
      ca_file: ${env:GPUSTACK_LOG_OTLP_CA_FILE}
    {{- end }}
    sending_queue:
      sizer: bytes
      queue_size: 16777216
    retry_on_failure:
      max_elapsed_time: 300s
service:
  telemetry:
    metrics:
      level: none
  extensions: [file_storage]
  pipelines:
    logs/higress:
      receivers: [filelog/higress]
      processors: [transform/higress]
      exporters: [otlp_http/logs]
{{- end }}
{{- if eq .Values.logging.higress.mode "nodeCollector" }}
{{- $name := printf "%s-higress-log-collector" .Release.Name }}
{{- $gateway := (index .Subcharts "higress-core").Values.gateway }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "chart_labels" . | indent 4 }}
data:
  collector.yaml: |
{{ include "gpustack.higressCollectorConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "chart_labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        checksum/collector-config: {{ include "gpustack.higressCollectorConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with (include "image_pull_secrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      nodeSelector:
        {{- merge (dict "kubernetes.io/os" "linux") ($gateway.nodeSelector | default dict) | toYaml | nindent 8 }}
      {{- with $gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "gpustack.hub" . }}/otel/opentelemetry-collector-contrib:0.144.0
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          env:
            {{- include "gpustack.loggingEnv" . | trim | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            # Kubelet owns the log files. Root can read them without extra capabilities.
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: offsets
              mountPath: /var/lib/otelcol
            {{- with (include "gpustack.loggingCaMount" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: offsets
          emptyDir: {}
        {{- with (include "gpustack.loggingCaVolume" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}
