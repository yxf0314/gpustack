{{- with (include "gpustack.tempoPodName" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpustack.tempoName" $ }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    statefulset.kubernetes.io/pod-name: {{ . | quote }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 3200
      targetPort: 3200
{{- end }}
