{{- define "gpustack.tempoConfig" -}}
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  flush_all_on_shutdown: true
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: {{ .Values.tracing.tempo.retention | quote }}
usage_report:
  reporting_enabled: false
{{- end -}}

{{- if and .Values.tracing.enabled .Values.server.enabled .Values.tracing.tempo.enabled (not .Values.tracing.endpoint) }}
{{- $name := include "gpustack.tempoName" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
data:
  tempo.yaml: |
{{ include "gpustack.tempoConfig" . | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: http
      port: 3200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "chart_labels" . | indent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        checksum/tempo-config: {{ include "gpustack.tempoConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with (include "gpustack.serverNodeSelector" . | trim) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "image_pull_secrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: {{ printf "%s/grafana/tempo:2.10.10" (include "gpustack.hub" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: http
              containerPort: 3200
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
  # StatefulSet claims are retained when the workload is removed.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if kindIs "string" .Values.tracing.tempo.storageClassName }}
        storageClassName: {{ .Values.tracing.tempo.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.tracing.tempo.storageSize | quote }}
{{- end }}
