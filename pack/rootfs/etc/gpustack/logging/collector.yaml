extensions:
  file_storage:
    create_directory: true

receivers:
  filelog/application:
    start_at: end
    storage: file_storage
    max_log_size: 10MiB
    operators:
      - type: json_parser
        on_error: drop
        parse_ints: true
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05Z07:00'
        severity:
          parse_from: attributes.severity
          overwrite_text: true
      - type: move
        from: attributes.service
        to: resource["service.name"]
      - type: move
        from: attributes.message
        to: body
      - type: move
        if: attributes.exception != nil
        from: attributes.exception
        to: attributes["exception.stacktrace"]

  filelog/higress:
    start_at: end
    storage: file_storage
    resource:
      service.name: higress
    operators:
      - type: json_parser
        parse_ints: true
        on_error: drop
        timestamp:
          parse_from: attributes.start_time
          layout_type: gotime
          layout: '2006-01-02T15:04:05Z07:00'
      - type: filter
        expr: 'attributes.path == nil or attributes.path matches "^/(healthz|livez|readyz|metrics)([/?]|$)"'

  filelog/engine:
    start_at: beginning
    storage: file_storage
    include_file_path: true
    resource:
      service.name: gpustack.engine
    multiline:
      line_start_pattern: '^(?:\[[0-9]{4}-[0-9]{2}-[0-9]{2} |(?:\([^)]*\) )?(?:TRACE|DEBUG|INFO|WARNING|WARN|ERROR|CRITICAL)[: ]|\{\s*"|(?:\x1b\[[0-9;]*m)*[0-9]{4}-[0-9]{2}-[0-9]{2} [^\r\n]*Generated vLLM request ID)'
    operators:
      - type: regex_parser
        id: engine_archive_identity
        parse_from: attributes["log.file.path"]
        on_error: drop
        regex: '/engine-export/archives/(?P<cluster_id>[0-9]+)\.(?P<worker_id>[0-9]+)\.(?P<model_id>[0-9]+)\.(?P<model_instance_id>[0-9]+)\.(?P<restart_count>[0-9]+)\.(?P<role>[A-Za-z0-9_-]+)\.[0-9]+/container(?:\.workload-[0-9a-f]{64})?\.log(?:\.[0-9]+)?$'
      # Reject standalone continuation fragments when filelog splits a large record.
      # Known request formats can contain prompts, output or headers.
      - type: filter
        expr: >-
          not (body matches '^(?:[[][0-9]{4}-[0-9]{2}-[0-9]{2} |(?:[(][^)]*[)] )?(?:TRACE|DEBUG|INFO|WARNING|WARN|ERROR|CRITICAL)[: ]|[{][[:space:]]*")' or
          (attributes.role == "router" and body contains "Generated vLLM request ID")) or
          body contains "Received request " or body contains "Generated response " or
          body contains "details: prompt:" or body contains "details: output_token_ids:" or
          body contains " JSON body:" or body contains "Receive: obj=" or
          body contains "Receive OpenAI: obj=" or body contains "Finish: obj="
      - type: regex_parser
        id: vllm_engine_request
        if: 'body contains "Added request "'
        regex: '^(?:\([^)]*\) )?INFO\s+[^\r\n]*?\sAdded request (?P<engine_request_id>[A-Za-z0-9_.:-]{1,256})\.(?:\r?\n|$)'
        on_error: send_quiet
      - type: regex_parser
        id: vllm_platform_request
        if: attributes.engine_request_id != nil
        parse_from: attributes.engine_request_id
        regex: '^(?:[0-9]+_)?(?:[A-Za-z]+-)?(?P<request_id>[0-9a-fA-F]{32}|[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12})(?:-[0-9a-fA-F]{8})?$'
        on_error: send_quiet
      - type: regex_parser
        id: vllm_pd_engine_coordinator
        if: '(attributes.role == "prefill" or attributes.role == "decode") and body contains "Added request " and body contains "___prefill_addr_"'
        regex: '^(?:\([^)]*\) )?INFO\s+[^\r\n]*?\sAdded request (?P<engine_request_id>(?:[0-9]+_)?(?:chatcmpl-|cmpl-)?(?P<pd_coordinator_id>___prefill_addr_[A-Za-z0-9_.:\[\]-]{1,256}___decode_addr_[A-Za-z0-9_.:\[\]-]{1,256}_[0-9a-fA-F]{32})(?:_[0-9]+)?(?:-[0-9a-fA-F]{8})?)\.(?:\r?\n|$)'
        on_error: send_quiet
      - type: regex_parser
        id: vllm_pd_router_coordinator
        if: 'attributes.role == "router" and body contains "Generated vLLM request ID"'
        regex: '^(?:\x1b\[[0-9;]*m)*[0-9]{4}-[0-9]{2}-[0-9]{2} [^\r\n]*vllm_router_rs::routers::http::vllm_pd_router[^\r\n]*Generated vLLM request ID(?: for P2P coordination)?: (?P<pd_coordinator_id>___prefill_addr_[A-Za-z0-9_.:\[\]-]{1,256}___decode_addr_[A-Za-z0-9_.:\[\]-]{1,256}_[0-9a-fA-F]{32})(?:\x1b\[[0-9;]*m)*(?:\r?\n|$)'
        on_error: drop
      - type: regex_parser
        id: sglang_request_event
        if: >-
          body matches '"event"[[:space:]]*:[[:space:]]*"request[.](received([.]openai)?|finished)"'
        regex: '^(?:\[[^\r\n\]]+\] )?(?P<engine_json>\{[^\r\n]+\})'
        on_error: drop
      - type: json_parser
        if: attributes.engine_json != nil
        parse_from: attributes.engine_json
        parse_to: attributes.engine_record
        parse_ints: true
        on_error: drop
      - type: json_parser
        id: sglang_router_event
        if: >-
          attributes.role == "router" and
          body matches '"target"[[:space:]]*:[[:space:]]*"smg(::[^"]+)?"'
        parse_to: attributes.router_record
        parse_ints: true
        on_error: drop

processors:
  transform/application:
    error_mode: ignore
    log_statements:
      - set(log.trace_id, TraceID(log.attributes["trace_id"])) where IsString(log.attributes["trace_id"]) and IsMatch(log.attributes["trace_id"], "^[0-9a-fA-F]{32}$")
      - set(log.span_id, SpanID(log.attributes["span_id"])) where IsString(log.attributes["span_id"]) and IsMatch(log.attributes["span_id"], "^[0-9a-fA-F]{16}$")
      - set(log.flags, log.attributes["trace_flags"]) where IsInt(log.attributes["trace_flags"]) and log.attributes["trace_flags"] >= 0 and log.attributes["trace_flags"] <= 255
      - delete_key(log.attributes, "timestamp")
      - delete_key(log.attributes, "severity")
      - delete_key(log.attributes, "trace_id")
      - delete_key(log.attributes, "span_id")
      - delete_key(log.attributes, "trace_flags")

  transform/higress:
    error_mode: ignore
    log_statements:
      # Envoy writes the active traceparent when the router dispatches upstream.
      - merge_maps(log.cache, ExtractPatterns(log.attributes["traceparent"], "^00-(?P<trace_id>[0-9a-f]{32})-(?P<propagated_span_id>[0-9a-f]{16})-01$"), "upsert") where IsString(log.attributes["traceparent"]) and IsString(log.attributes["upstream_host"]) and log.attributes["upstream_host"] != "-"
      - set(log.trace_id, TraceID(log.cache["trace_id"])) where IsString(log.cache["trace_id"]) and log.cache["trace_id"] != "00000000000000000000000000000000" and log.cache["propagated_span_id"] != "0000000000000000"
      - set(log.body, "Higress access log")
      # Only the successful response's native PD coordinator ID is exported from AI statistics.
      - delete_key(log.attributes, "pd_coordinator_id")
      - set(log.cache["ai_log_json"], log.attributes["ai_log"]) where (log.attributes["response_code"] == 200 or log.attributes["response_code"] == "200") and IsString(log.attributes["ai_log"]) and IsMatch(log.attributes["ai_log"], "___prefill_addr_")
      # Envoy's JSON access log can escape an already serialized AI statistics object.
      - set(log.cache["ai_log_json"], ParseJSON(Concat(["[\"", log.cache["ai_log_json"], "\"]"], ""))[0]) where IsString(log.cache["ai_log_json"]) and HasPrefix(log.cache["ai_log_json"], "{\\\"")
      - set(log.cache["ai_log"], ParseJSON(log.cache["ai_log_json"])) where IsString(log.cache["ai_log_json"])
      - set(log.cache["ai_log"], log.attributes["ai_log"]) where (log.attributes["response_code"] == 200 or log.attributes["response_code"] == "200") and IsMap(log.attributes["ai_log"])
      - merge_maps(log.attributes, ExtractPatterns(log.cache["ai_log"]["chat_id"], "^(?:chatcmpl-|cmpl-)(?P<pd_coordinator_id>___prefill_addr_[A-Za-z0-9_.:\\[\\]-]{1,256}___decode_addr_[A-Za-z0-9_.:\\[\\]-]{1,256}_[0-9a-fA-F]{32})$"), "upsert") where IsString(log.cache["ai_log"]["chat_id"])
      - keep_keys(log.attributes, ["request_id", "pd_coordinator_id", "method", "path", "response_code", "duration", "response_flags", "upstream_cluster", "upstream_host"])
      - set(log.attributes["path"], Split(log.attributes["path"], "?")[0]) where IsString(log.attributes["path"])
      - set(log.body, Concat([log.attributes["method"], log.attributes["path"], String(log.attributes["response_code"])], " ")) where IsString(log.attributes["method"]) and IsString(log.attributes["path"]) and (IsString(log.attributes["response_code"]) or IsInt(log.attributes["response_code"]))

  transform/engine:
    error_mode: ignore
    log_statements:
      - delete_key(log.attributes, "log.file.path")
      - set(log.body, "vLLM Router generated PD request ID") where log.attributes["role"] == "router" and log.attributes["pd_coordinator_id"] != nil
      - set(log.body, "SGLang request event") where log.attributes["engine_record"] != nil
      - set(log.body, log.attributes["engine_record"]["event"]) where IsString(log.attributes["engine_record"]["event"]) and IsMatch(log.attributes["engine_record"]["event"], "^request[.](received([.]openai)?|finished)$")
      - set(log.attributes["engine_request_id"], log.attributes["engine_record"]["rid"]) where IsString(log.attributes["engine_record"]["rid"]) and IsMatch(log.attributes["engine_record"]["rid"], "^[A-Za-z0-9_.:-]{1,256}$")
      - set(log.attributes["request_id"], log.attributes["engine_record"]["headers"]["x-request-id"]) where IsString(log.attributes["engine_record"]["headers"]["x-request-id"]) and IsMatch(log.attributes["engine_record"]["headers"]["x-request-id"], "^[0-9a-fA-F]{32}$|^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$")
      # Prefill and Decode use different engine IDs but share a room for this dispatch.
      - set(log.attributes["pd_attempt_id"], String(log.attributes["engine_record"]["obj"]["bootstrap_room"])) where (log.attributes["role"] == "prefill" or log.attributes["role"] == "decode") and log.attributes["request_id"] != nil and IsInt(log.attributes["engine_record"]["obj"]["bootstrap_room"])
      - delete_key(log.attributes, "engine_record")
      - delete_key(log.attributes, "engine_json")
      # A Router span includes the raw URI. Export only the known request fields.
      - set(log.body, "SGLang Router log") where log.attributes["router_record"] != nil
      - set(log.body, log.attributes["router_record"]["message"]) where IsString(log.attributes["router_record"]["message"]) and log.attributes["router_record"]["span"] == nil and log.attributes["router_record"]["spans"] == nil
      - set(log.attributes["request_id"], log.attributes["router_record"]["span"]["request_id"]) where log.attributes["router_record"]["span"]["name"] == "http_request" and log.attributes["router_record"]["span"]["method"] == "POST" and IsString(log.attributes["router_record"]["span"]["request_id"]) and IsMatch(log.attributes["router_record"]["span"]["request_id"], "^[0-9a-fA-F]{32}$|^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$")
      - set(log.body, log.attributes["router_record"]["message"]) where log.attributes["request_id"] != nil and IsString(log.attributes["router_record"]["message"]) and IsMatch(log.attributes["router_record"]["message"], "^(started processing request|finished processing request|request failed with (client|server) error|Sending concurrent requests|Received concurrent requests)$")
      - set(log.attributes["response_code"], log.attributes["router_record"]["span"]["status_code"]) where log.attributes["request_id"] != nil and IsInt(log.attributes["router_record"]["span"]["status_code"])
      - set(log.attributes["prefill_endpoint"], log.attributes["router_record"]["prefill_url"]) where log.attributes["router_record"]["message"] == "Sending concurrent requests" and log.attributes["request_id"] != nil and IsString(log.attributes["router_record"]["prefill_url"]) and IsMatch(log.attributes["router_record"]["prefill_url"], "^https?://([a-zA-Z0-9.-]+|[[][a-fA-F0-9:]+[]]):[0-9]{1,5}$")
      - set(log.attributes["decode_endpoint"], log.attributes["router_record"]["decode_url"]) where log.attributes["router_record"]["message"] == "Sending concurrent requests" and log.attributes["request_id"] != nil and IsString(log.attributes["router_record"]["decode_url"]) and IsMatch(log.attributes["router_record"]["decode_url"], "^https?://([a-zA-Z0-9.-]+|[[][a-fA-F0-9:]+[]]):[0-9]{1,5}$")
      - delete_key(log.attributes, "router_record")

exporters:
  otlp_http/logs:
    sending_queue:
      sizer: bytes
      queue_size: 16777216 # 16 MiB
    retry_on_failure:
      max_elapsed_time: 300s

service:
  telemetry:
    metrics:
      level: none
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog/application]
      processors: [transform/application]
      exporters: [otlp_http/logs]
    logs/higress:
      receivers: [filelog/higress]
      processors: [transform/higress]
      exporters: [otlp_http/logs]
    logs/engine:
      receivers: [filelog/engine]
      processors: [transform/engine]
      exporters: [otlp_http/logs]
